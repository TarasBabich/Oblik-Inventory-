name: Build Windows EXE

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test core logic
        run: |
          python tests/smoke_test.py

      - name: Import Flet UI
        run: |
          python -c "import src.main; print('FLET UI IMPORT OK')"

      - name: Build Oblik.exe with Flet
        run: |
          flet pack --yes --name Oblik --distpath dist --product-name "Oblik Inventory" --product-version 0.2.5 --file-version 0.2.5.0 src/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Oblik-Windows-Flet
          path: dist/Oblik.exe
          if-no-files-found: error
